name: Build AI Emoji Keyboard

on:
  push:
    paths:
      - 'android-build/**'
      - '.github/workflows/android-keyboard.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore Android source
        run: |
          mkdir -p work
          cat android-build/chunks/chunk-* | base64 -d > work/android-app.tar.gz
          tar -tzf work/android-app.tar.gz >/dev/null
          tar -xzf work/android-app.tar.gz -C work
          sed -i 's/Ui\.column(/Ui.col(/g' work/android-app/app/src/main/java/com/mehan/emojikeyboard/EmojiKeyboardService.java
      - name: Patch WhatsApp advertised MIME experiment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('work/android-app/app/src/main/java/com/mehan/emojikeyboard/EmojiKeyboardService.java')
          s = p.read_text()

          old = '      b.setOnClickListener(v -> insert(item));\n      grid.addView(b, new android.view.ViewGroup.LayoutParams(width, Ui.dp(this, 72)));'
          new = '      b.setOnClickListener(v -> insert(item));\n      b.setOnLongClickListener(v -> insertWithAdvertisedMime(item, "image/webp.wa.sticker"));\n      grid.addView(b, new android.view.ViewGroup.LayoutParams(width, Ui.dp(this, 72)));'
          if old not in s:
              raise SystemExit('Could not locate My Emojis click listener')
          s = s.replace(old, new, 1)

          marker = '\n  private void insert(EmojiStore.Item item) {'
          lines = [
              '  private boolean insertWithAdvertisedMime(EmojiStore.Item item, String mime) {',
              '    EditorInfo info = getCurrentInputEditorInfo();',
              '    InputConnection c = getCurrentInputConnection();',
              '    if (info == null || c == null) return false;',
              '    boolean advertised = false;',
              '    if (info.contentMimeTypes != null) {',
              '      for (String accepted : info.contentMimeTypes) {',
              '        if (ClipDescription.compareMimeTypes(mime, accepted)) {',
              '          advertised = true;',
              '          break;',
              '        }',
              '      }',
              '    }',
              '    if (!advertised) {',
              '      Ui.toast(this, "WhatsApp did not advertise " + mime);',
              '      return true;',
              '    }',
              '    try {',
              '      InputContentInfo content = new InputContentInfo(',
              '          item.uri(), new ClipDescription(item.label, new String[] {mime}), null);',
              '      boolean accepted = c.commitContent(',
              '          content, InputConnection.INPUT_CONTENT_GRANT_READ_URI_PERMISSION, null);',
              '      Ui.toast(this, accepted ? "Sent using " + mime : "WhatsApp rejected " + mime);',
              '    } catch (RuntimeException e) {',
              '      Ui.toast(this, "WhatsApp blocked " + mime);',
              '    }',
              '    return true;',
              '  }',
              ''
          ]
          if marker not in s:
              raise SystemExit('Could not locate insert method')
          s = s.replace(marker, '\n' + '\n'.join(lines) + marker, 1)

          target = '    List<EmojiStore.Item> items = store.list("");'
          probe = [
              '    EditorInfo probeInfo = getCurrentInputEditorInfo();',
              '    StringBuilder probeText = new StringBuilder("Target: ");',
              '    probeText.append(probeInfo == null || probeInfo.packageName == null ? "unknown" : probeInfo.packageName);',
              '    probeText.append("\\nLong-press emoji = image/webp.wa.sticker test");',
              '    TextView probeView = Ui.text(this, probeText.toString(), 12, Ui.MUTED);',
              '    probeView.setPadding(Ui.dp(this, 8), Ui.dp(this, 4), Ui.dp(this, 8), Ui.dp(this, 4));',
              '    body.addView(probeView);',
              '    List<EmojiStore.Item> items = store.list("");'
          ]
          if target not in s:
              raise SystemExit('Could not locate My Emojis list')
          s = s.replace(target, '\n'.join(probe), 1)
          p.write_text(s)
          PY
      - name: Verify MIME experiment patch
        run: |
          grep -n -E 'setOnLongClickListener|insertWithAdvertisedMime|webp.wa.sticker|commitContent' work/android-app/app/src/main/java/com/mehan/emojikeyboard/EmojiKeyboardService.java
      - name: Build debug APK
        run: gradle -p work/android-app :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Emoji-Keyboard-v1.5.0-whatsapp-mime-lab
          path: work/android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
