name: Build AI Emoji Keyboard

on:
  push:
    paths:
      - 'android-build/**'
      - '.github/workflows/android-keyboard.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore Android source
        run: |
          mkdir -p work
          cat android-build/chunks/chunk-* | base64 -d > work/android-app.tar.gz
          tar -tzf work/android-app.tar.gz >/dev/null
          tar -xzf work/android-app.tar.gz -C work
          sed -i 's/Ui\.column(/Ui.col(/g' work/android-app/app/src/main/java/com/mehan/emojikeyboard/EmojiKeyboardService.java
      - name: Patch version and Instagram capability probe
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Keep the app/package the same, but give Android a newer version code/name.
          candidates = [
              Path('work/android-app/app/build.gradle'),
              Path('work/android-app/app/build.gradle.kts'),
          ]
          for gp in candidates:
              if gp.exists():
                  s = gp.read_text()
                  import re
                  s = re.sub(r'versionCode\s*[= ]\s*\d+', 'versionCode = 1601' if gp.suffix == '.kts' else 'versionCode 1601', s)
                  s = re.sub(r'versionName\s*[= ]\s*["\'][^"\']+["\']', 'versionName = "1.6.1"' if gp.suffix == '.kts' else 'versionName "1.6.1"', s)
                  gp.write_text(s)

          p = Path('work/android-app/app/src/main/java/com/mehan/emojikeyboard/EmojiKeyboardService.java')
          s = p.read_text()
          target = '    List<EmojiStore.Item> items = store.list("");'
          lines = [
              '    EditorInfo probeInfo = getCurrentInputEditorInfo();',
              '    String probePackage = probeInfo == null || probeInfo.packageName == null ? "unknown" : probeInfo.packageName;',
              '    if (probePackage.contains("instagram")) {',
              '      StringBuilder probe = new StringBuilder("Instagram accepts: ");',
              '      if (probeInfo.contentMimeTypes == null || probeInfo.contentMimeTypes.length == 0) {',
              '        probe.append("text only / no rich MIME types advertised");',
              '      } else {',
              '        for (int i = 0; i < probeInfo.contentMimeTypes.length; i++) {',
              '          if (i > 0) probe.append(", ");',
              '          probe.append(probeInfo.contentMimeTypes[i]);',
              '        }',
              '      }',
              '      TextView probeView = Ui.text(this, probe.toString(), 12, Ui.MUTED);',
              '      probeView.setPadding(Ui.dp(this, 8), Ui.dp(this, 4), Ui.dp(this, 8), Ui.dp(this, 4));',
              '      body.addView(probeView);',
              '    }',
              '    List<EmojiStore.Item> items = store.list("");'
          ]
          if target not in s:
              raise SystemExit('Could not locate My Emojis list')
          s = s.replace(target, '\n'.join(lines), 1)
          p.write_text(s)
          PY
      - name: Build debug APK
        run: gradle -p work/android-app :app:assembleDebug --stacktrace
      - name: Sign with stable development update key
        run: |
          base64 -d android-build/dev-update-key.jks.b64 > work/dev-update-key.jks
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" sign \
            --ks work/dev-update-key.jks \
            --ks-key-alias emojiupdate \
            --ks-pass pass:emojiupdate2026 \
            --key-pass pass:emojiupdate2026 \
            --out work/AI-Emoji-Keyboard-v1.6.1-stable-update.apk \
            work/android-app/app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --verbose --print-certs work/AI-Emoji-Keyboard-v1.6.1-stable-update.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Emoji-Keyboard-v1.6.1-stable-update
          path: work/AI-Emoji-Keyboard-v1.6.1-stable-update.apk
          if-no-files-found: error
