name: Build Instagram GIF Keyboard Update

on:
  push:
    paths:
      - '.github/workflows/android-keyboard-gif.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore Android source
        run: |
          mkdir -p work
          cat android-build/chunks/chunk-* | base64 -d > work/android-app.tar.gz
          tar -tzf work/android-app.tar.gz >/dev/null
          tar -xzf work/android-app.tar.gz -C work
          sed -i 's/Ui\.column(/Ui.col(/g' work/android-app/app/src/main/java/com/mehan/emojikeyboard/EmojiKeyboardService.java
      - name: Patch Instagram GIF-only mode
        env:
          PROVIDER_B64: 
          METHODS_B64: 
          HINT_B64: 
        run: |
          python3 - <<'PY'
          import base64, os, re
          from pathlib import Path
          for gp in [Path('work/android-app/app/build.gradle'), Path('work/android-app/app/build.gradle.kts')]:
              if gp.exists():
                  text = gp.read_text()
                  text = re.sub(r'versionCode\s*[= ]\s*\d+', 'versionCode = 1602' if gp.suffix == '.kts' else 'versionCode 1602', text)
                  text = re.sub(r'versionName\s*[= ]\s*["\'][^"\']+["\']', 'versionName = "1.6.2"' if gp.suffix == '.kts' else 'versionName "1.6.2"', text)
                  gp.write_text(text)
          provider = Path('work/android-app/app/src/main/java/com/mehan/emojikeyboard/EmojiProvider.java')
          provider.write_bytes(base64.b64decode(os.environ['PROVIDER_B64']))
          service = Path('work/android-app/app/src/main/java/com/mehan/emojikeyboard/EmojiKeyboardService.java')
          s = service.read_text()
          old = '      b.setOnClickListener(v -> insert(item));\n      grid.addView(b, new android.view.ViewGroup.LayoutParams(width, Ui.dp(this, 72)));'
          new = '      b.setOnClickListener(v -> insertForCurrentApp(item));\n      grid.addView(b, new android.view.ViewGroup.LayoutParams(width, Ui.dp(this, 72)));'
          if old not in s: raise SystemExit('Could not locate My Emojis click listener')
          s = s.replace(old, new, 1)
          marker = '\n  private void insert(EmojiStore.Item item) {'
          if marker not in s: raise SystemExit('Could not locate insert method')
          s = s.replace(marker, '\n' + base64.b64decode(os.environ['METHODS_B64']).decode() + marker, 1)
          target = '    List<EmojiStore.Item> items = store.list("");'
          if target not in s: raise SystemExit('Could not locate My Emojis list')
          s = s.replace(target, base64.b64decode(os.environ['HINT_B64']).decode(), 1)
          service.write_text(s)
          PY
      - name: Verify patch
        run: |
          grep -n -E 'insertForCurrentApp|insertInstagramGif|image/gif|Instagram mode: GIF only' work/android-app/app/src/main/java/com/mehan/emojikeyboard/EmojiKeyboardService.java
          grep -n -E 'gif|png|openFile|getType' work/android-app/app/src/main/java/com/mehan/emojikeyboard/EmojiProvider.java
      - name: Build debug APK
        run: gradle -p work/android-app :app:assembleDebug --stacktrace
      - name: Sign with stable update key
        run: |
          base64 -d android-build/dev-update-key.jks.b64 > work/dev-update-key.jks
          PASS=$(python3 -c "import re,pathlib; t=pathlib.Path('.github/workflows/android-keyboard.yml').read_text(); print(re.search(r'--ks-pass pass:([^\\\\\\s]+)', t).group(1))")
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" sign \
            --ks work/dev-update-key.jks \
            --ks-key-alias emojiupdate \
            --ks-pass "pass:$PASS" \
            --key-pass "pass:$PASS" \
            --out work/AI-Emoji-Keyboard-v1.6.2-instagram-gif-only.apk \
            work/android-app/app/build/outputs/apk/debug/app-debug.apk
          "$APKSIGNER" verify --verbose --print-certs work/AI-Emoji-Keyboard-v1.6.2-instagram-gif-only.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Emoji-Keyboard-v1.6.2-instagram-gif-only
          path: work/AI-Emoji-Keyboard-v1.6.2-instagram-gif-only.apk
          if-no-files-found: error
